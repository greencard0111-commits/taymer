<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Taymer (Maxfiy)</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #222; color: white; text-align: center; overflow: hidden; }
        #pin-screen { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #111; }
        input[type="number"] { font-size: 24px; padding: 10px; width: 150px; text-align: center; margin-bottom: 20px; border-radius: 8px; border: none; }
        button { font-size: 20px; padding: 10px 30px; border: none; border-radius: 8px; background: #007bff; color: white; cursor: pointer; }
        #app-screen { display: none; position: relative; width: 100vw; height: 100vh; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; pointer-events: none; }
        .line { position: absolute; top: 0; left: 50%; width: 4px; height: 100%; background: lime; transform: translateX(-50%); z-index: 5; }
        #timer { font-size: 60px; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 10px; margin-top: 20px; display: inline-block; pointer-events: auto; }
        #controls { margin-bottom: 30px; pointer-events: auto; }
        #start-btn { background: #28a745; font-size: 24px; padding: 15px 40px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        #reset-btn { background: #dc3545; font-size: 24px; padding: 15px 40px; margin-left: 10px; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        #status-text { font-size: 24px; font-weight: bold; color: yellow; text-shadow: 2px 2px 4px #000; margin-top: 10px; }
    </style>
</head>
<body>

<!-- Parol so'raydigan oyna -->
<div id="pin-screen">
    <h2>Sprint Taymer</h2>
    <p>Maxfiy parolni kiriting:</p>
    <input type="number" id="pin-input" placeholder="****">
    <button onclick="checkPin()">Kirish</button>
    <p id="pin-error" style="color:red; display:none; margin-top:15px;">Xato parol! Qaytadan urinib ko'ring.</p>
</div>

<!-- Asosiy dastur (Kamera va Taymer) -->
<div id="app-screen">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <div class="line"></div>
    <div id="ui-layer">
        <div>
            <span id="timer">0.00</span>
            <div id="status-text">Kutilyapti...</div>
        </div>
        <div id="controls">
            <button id="start-btn" onclick="startSequence()">START</button>
            <button id="reset-btn" onclick="resetTimer()">Yangi urinish</button>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // PAROLNI SHU YERDAN O'ZGARTIRISHINGIZ MUMKIN
    const PAROL = "1707"; 
    // ==========================================

    let startTime, timerInterval, isRunning = false;
    let video = document.getElementById('video');
    let canvas = document.getElementById('canvas');
    let ctx = canvas.getContext('2d', { willReadFrequently: true });
    let lastImageData = null;
    let animationFrame;
    let statusText = document.getElementById('status-text');

    function checkPin() {
        let val = document.getElementById('pin-input').value;
        if (val === PAROL) {
            document.getElementById('pin-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            startCamera(); 
        } else {
            document.getElementById('pin-error').style.display = 'block';
        }
    }

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            video.srcObject = stream;
        } catch (err) {
            alert("Kameraga ulanib bo'lmadi. Brauzer ruxsatlarini tekshiring.");
        }
    }

    // Ovozli gapirish funksiyasi
    function speakText(text) {
        let msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'uz-UZ';
        msg.rate = 1.0;
        window.speechSynthesis.speak(msg);
    }

    // Hushtak ovozi funksiyasi
    function playBeep() {
        let actx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = actx.createOscillator();
        osc.connect(actx.destination);
        osc.frequency.value = 1000;
        osc.start();
        setTimeout(() => osc.stop(), 400);
    }

    function startSequence() {
        document.getElementById('start-btn').style.display = 'none';
        
        statusText.innerText = "Diqqat...";
        statusText.style.color = "orange";
        speakText("Diqqat");

        setTimeout(() => {
            statusText.innerText = "Tayyorlan...";
            statusText.style.color = "yellow";
            speakText("Tayyorlan");

            setTimeout(() => {
                statusText.innerText = "START!";
                statusText.style.color = "lime";
                playBeep(); // Hushtak
                
                // Asosiy taymerni ishga tushirish
                startTimer();
                
            }, 1500); // "Tayyorlan" dan keyin 1.5 sek
        }, 1500); // "Diqqat" dan keyin 1.5 sek
    }

    function startTimer() {
        startTime = Date.now();
        isRunning = true;
        document.getElementById('reset-btn').style.display = 'inline-block';
        
        timerInterval = setInterval(() => {
            document.getElementById('timer').innerText = ((Date.now() - startTime) / 1000).toFixed(2);
        }, 10);

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        lastImageData = null;
        detectMotion();
    }

    function detectMotion() {
        if (!isRunning) return;
        
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        let x = Math.floor(canvas.width / 2) - 10;
        let width = 20;
        let currentData = ctx.getImageData(x, 0, width, canvas.height).data;

        if (lastImageData) {
            let diff = 0;
            for (let i = 0; i < currentData.length; i += 4) {
                diff += Math.abs(currentData[i] - lastImageData[i]);     
                diff += Math.abs(currentData[i+1] - lastImageData[i+1]); 
                diff += Math.abs(currentData[i+2] - lastImageData[i+2]); 
            }
            
            let avgDiff = diff / (currentData.length / 4);
            
            // Harakat sezilsa (startdan kamida 0.5 sek o'tgan bo'lishi kerak)
            if (avgDiff > 35 && (Date.now() - startTime) > 500) { 
                stopTimer();
                return;
            }
        }
        lastImageData = currentData;
        animationFrame = requestAnimationFrame(detectMotion);
    }

    function stopTimer() {
        isRunning = false;
        clearInterval(timerInterval);
        cancelAnimationFrame(animationFrame);
        statusText.innerText = "MARRA!";
        statusText.style.color = "red";
    }

    function resetTimer() {
        document.getElementById('timer').innerText = "0.00";
        statusText.innerText = "Kutilyapti...";
        statusText.style.color = "yellow";
        document.getElementById('start-btn').style.display = 'inline-block';
        document.getElementById('reset-btn').style.display = 'none';
    }
</script>
</body>
</html>
